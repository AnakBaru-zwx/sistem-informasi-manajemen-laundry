<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pesanan Laundry</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="content">

        <h1>Data Pesanan Laundry</h1>
        <p>Daftar transaksi laundry pelanggan.</p>

        <table>
            <thead>
                <tr>
                    <th>ID Pesanan</th>
                    <th>Nama Pelanggan</th>
                    <th>No. HP</th>
                    <th>Berat (Kg)</th>
                    <th>Harga per Kg</th>
                    <th>Total Harga</th>
                    <th>Status Pengerjaan</th>
                    <th>Status Pembayaran</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="tabelPesanan">
                <!-- Data pesanan akan ditampilkan di sini -->
            </tbody>
        </table>

    </main>

    <script src="pesanan.js"></script>
</body>
</html>
