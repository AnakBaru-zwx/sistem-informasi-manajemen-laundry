<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pesanan - Laundry App</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tambah-pesanan.css">
</head>
<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Laundry App</h2>

            <nav>
                <a href="index.html">Data Pelanggan</a>
                <a href="pesanan.html">Data Pesanan</a>
                <a href="tambah-pesanan.html">Tambah Pesanan</a>
            </nav>
        </aside>

        <!-- Konten utama -->
        <main class="content">

            <h1>Tambah Pesanan</h1>
            <p>Silakan isi formulir untuk menambahkan pesanan laundry.</p>

            <form id="formPesanan">

                <label for="pelanggan_id">Pilih Pelanggan</label>
                <select id="pelanggan_id" required>
                    <option value="">-- Pilih Pelanggan --</option>
                </select>

                <label for="berat">Berat Laundry (Kg)</label>
                <input
                    type="number"
                    id="berat"
                    min="0.1"
                    step="0.1"
                    placeholder="Masukkan berat laundry"
                    required
                >

                <p>Harga per Kg: Rp7.000</p>

                <p>
                    Estimasi Total Harga:
                    <strong id="totalHarga">Rp0</strong>
                </p>

                <button type="submit">Simpan Pesanan</button>

                <p id="pesanStatus" role="status"></p>

            </form>

        </main>

    </div>

    <script src="tambah-pesanan.js"></script>

</body>
</html>
